<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — FairFine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> FairFine</div>
  <div style="display:flex; align-items:center; gap:10px;">
    <button class="btn small ghost hidden" id="logoutBtn">Log Out</button>
    <a class="back-link" href="index.html">&larr; Home</a>
  </div>
</div>

<div class="wrap">

  <!-- LOGIN GATE -->
  <div id="loginGate">
    <div class="eyebrow">Admin Login</div>
    <h1 class="page-title">Restricted Access</h1>
    <p class="subtitle">Enter the admin password to continue.</p>
    <div class="card" style="max-width:360px;">
      <label for="pw">Password</label>
      <input type="password" id="pw" placeholder="Enter password" autocomplete="off">
      <button class="btn" id="loginBtn">Log In</button>
      <div class="status-msg" id="loginMsg"></div>
    </div>
  </div>

  <!-- DASHBOARD (hidden until login) -->
  <div id="dashboard" class="hidden">
    <div class="eyebrow">Admin Dashboard</div>
    <h1 class="page-title">Review & Analytics</h1>
    <p class="subtitle">Decide on appeals and see fine patterns across campus.</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="appeals">Appeals</button>
      <button class="tab-btn" data-tab="analytics">Analytics</button>
    </div>

    <div id="tab-appeals">
      <div id="appealsList"></div>
    </div>

    <div id="tab-analytics" class="hidden">
      <div class="stat-row" id="statRow"></div>

      <div class="card">
        <div class="eyebrow">Fines by Reason</div>
        <div class="bar-chart" id="chartReason"></div>
      </div>

      <div class="card">
        <div class="eyebrow">Fines by Location</div>
        <div class="bar-chart" id="chartLocation"></div>
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>
<script>
seedIfEmpty();

const loginGate = document.getElementById('loginGate');
const dashboard = document.getElementById('dashboard');
const logoutBtn = document.getElementById('logoutBtn');

function showDashboard() {
  loginGate.classList.add('hidden');
  dashboard.classList.remove('hidden');
  logoutBtn.classList.remove('hidden');
  renderAppeals();
  renderAnalytics();
}

(function init() {
  if (sessionStorage.getItem(ADMIN_SESSION_KEY) === '1') {
    showDashboard();
  }
})();

document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

function tryLogin() {
  const pw = document.getElementById('pw').value;
  const msg = document.getElementById('loginMsg');
  if (pw === ADMIN_PASSWORD) {
    sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
    document.getElementById('pw').value = '';
    showDashboard();
  } else {
    msg.textContent = "Incorrect password.";
    msg.className = "status-msg show err";
  }
}

logoutBtn.addEventListener('click', () => {
  sessionStorage.removeItem(ADMIN_SESSION_KEY);
  logoutBtn.classList.add('hidden');
  dashboard.classList.add('hidden');
  loginGate.classList.remove('hidden');
});

// tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-appeals').classList.toggle('hidden', btn.dataset.tab !== 'appeals');
    document.getElementById('tab-analytics').classList.toggle('hidden', btn.dataset.tab !== 'analytics');
  });
});

function renderAppeals() {
  const fines = getFines().filter(f => f.status === 'appealed');
  const list = document.getElementById('appealsList');

  if (fines.length === 0) {
    list.innerHTML = `<div class="empty-state">No pending appeals right now.</div>`;
    return;
  }

  // All dynamic values are escaped, and fine IDs are passed via data-*
  // attributes (not string-interpolated into onclick=""), so stored fine
  // data can never be used to inject markup or script into this page.
  list.innerHTML = fines.map(f => `
    <div class="ticket">
      <div>
        <div class="ticket-id">${escapeHtml(f.id)} &middot; ${escapeHtml(f.studentId)}</div>
        <div class="ticket-reason">${escapeHtml(displayReason(f))}</div>
        <div class="ticket-meta">
          ${escapeHtml(f.location)} &middot; ${fmtTime(f.time)}<br>
          <em>"${escapeHtml(f.appeal.text)}"</em>
        </div>
      </div>
      <div class="ticket-right">
        <span class="badge ${badgeClass(f.status)}">${escapeHtml(f.status)}</span>
        <div style="display:flex; gap:6px;">
          <button class="btn small" style="background:var(--green); color:#0c1a10;" data-action="approved" data-fine-id="${escapeHtml(f.id)}">Approve</button>
          <button class="btn small danger" data-action="rejected" data-fine-id="${escapeHtml(f.id)}">Reject</button>
        </div>
      </div>
    </div>
  `).join('');
}

document.getElementById('appealsList').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-fine-id]');
  if (!btn) return;
  decide(btn.dataset.fineId, btn.dataset.action);
});

function decide(fineId, decision) {
  resolveAppeal(fineId, decision);
  renderAppeals();
  renderAnalytics();
}

function renderAnalytics() {
  const fines = getFines();
  const total = fines.length;
  const pending = fines.filter(f => f.status === 'appealed').length;
  const approved = fines.filter(f => f.status === 'approved').length;
  const rejected = fines.filter(f => f.status === 'rejected').length;

  document.getElementById('statRow').innerHTML = `
    <div class="stat-box"><div class="num">${total}</div><div class="lbl">Total Fines</div></div>
    <div class="stat-box"><div class="num">${pending}</div><div class="lbl">Pending Appeals</div></div>
    <div class="stat-box"><div class="num">${approved}</div><div class="lbl">Approved</div></div>
    <div class="stat-box"><div class="num">${rejected}</div><div class="lbl">Rejected</div></div>
  `;

  drawBarChart('chartReason', groupCount(fines, 'reason'));
  drawBarChart('chartLocation', groupCount(fines, 'location'));
}

function groupCount(fines, key) {
  const counts = {};
  fines.forEach(f => { counts[f[key]] = (counts[f[key]] || 0) + 1; });
  return counts;
}

function drawBarChart(elId, counts) {
  const el = document.getElementById(elId);
  const entries = Object.entries(counts);
  if (entries.length === 0) {
    el.innerHTML = `<div class="empty-state" style="width:100%;">No data yet.</div>`;
    return;
  }
  const max = Math.max(...entries.map(e => e[1]));
  el.innerHTML = entries.map(([label, count]) => `
    <div class="bar-col">
      <div class="bar-count">${count}</div>
      <div class="bar" style="height:${Math.max((count / max) * 100, 4)}%"></div>
      <div class="bar-label">${escapeHtml(label)}</div>
    </div>
  `).join('');
}
</script>
</body>
</html>
